services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reel_memory
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: reel_memory
    ports:
      - "5432:5432"
    volumes:
      - reel-memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reel_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reel-memory-pgdata:
